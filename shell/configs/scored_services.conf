# name|type|target|expected
#
# Types:
#   tcp     target=host:port          expected=up
#   http    target=http(s)://URL      expected=HTTP status (default 200)
#   dns     target=server:query-name  expected=nonempty or exact answer line
#   systemd target=unit.service       expected=active
#   openrc  target=service-name       expected=started
# An empty configuration returns UNKNOWN and nonzero; it does not prove availability.
# DNS targets currently use IPv4 addresses/hostnames for the server.
# TCP confirms a connection, not authentication or a scored application transaction.
#
# Examples (remove # and adapt to the competition packet):
# ssh|tcp|127.0.0.1:22|up
# website|http|http://127.0.0.1/|200
# dns|dns|127.0.0.1:example.internal|nonempty
# database|systemd|postgresql.service|active
# database-openrc|openrc|postgresql|started
