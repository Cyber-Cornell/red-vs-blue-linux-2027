# Managed CCDC security log streams. Installed as /etc/rsyslog.d/90-ccdc.conf.
# Distribution-owned modules and general log routing stay in /etc/rsyslog.conf.

$FileOwner root
$FileGroup root
$FileCreateMode 0640
$DirCreateMode 0750
$Umask 0027

auth,authpriv.*                            /var/log/ccdc-auth.log
kern.warning                              /var/log/ccdc-kernel.log
daemon.warning                            /var/log/ccdc-daemon.log
