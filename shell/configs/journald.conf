[Journal]
# Storage settings
Storage=persistent
Compress=yes
Seal=yes

# Size limits
SystemMaxUse=256M
SystemKeepFree=512M
SystemMaxFileSize=32M
RuntimeMaxUse=64M

# Rate limiting
RateLimitIntervalSec=30s
RateLimitBurst=5000

# What to log
MaxLevelStore=debug
MaxLevelSyslog=debug
MaxLevelKMsg=notice
MaxLevelConsole=info
MaxLevelWall=emerg

# Forward to syslog (for rsyslog integration)
ForwardToSyslog=yes
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=yes

# Time accuracy
SyncIntervalSec=5m

# Split by user (optional)
SplitMode=uid
